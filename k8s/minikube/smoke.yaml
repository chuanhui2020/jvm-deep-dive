apiVersion: batch/v1
kind: Job
metadata:
  name: jvm-minikube-smoke
  labels:
    app: jvm-lab
    lab: env
    purpose: smoke
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: jvm-lab
        lab: env
        purpose: smoke
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: lab
          image: jvm-lab-env:local
          imagePullPolicy: IfNotPresent
          env:
            - name: LAB_START_DELAY_SECONDS
              value: "0"
            - name: LAB_HOLD_SECONDS
              value: "0"
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: evidence
              mountPath: /data
      volumes:
        - name: temporary
          emptyDir: {}
        - name: evidence
          emptyDir: {}
