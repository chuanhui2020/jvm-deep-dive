<svg xmlns="http://www.w3.org/2000/svg" width="900" height="984" viewBox="0 0 900 984" role="img" aria-labelledby="title desc">
<title id="title">从源码到解释执行与 JIT</title><desc id="desc">源码经过编译、加载、执行与优化；假设失效时从编译代码去优化，恢复执行。图中的箭头表示教学路径，不规定每个方法必须经历固定阶段。</desc>
