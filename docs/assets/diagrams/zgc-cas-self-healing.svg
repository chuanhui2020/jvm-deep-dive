<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
<title id="title">ZGC：用 CAS 避免覆盖并发更新</title><desc id="desc">屏障读取旧编码 r 并找到有效表示 r′。应用线程先写入新引用 Q；屏障只在字段仍等于 r 时 CAS 写回 r′，比较失败时保留 Q。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#1e293b;text-anchor:middle}.edge{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}.life{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:7 6}</style>
<rect width="900" height="700" rx="12" fill="#fff"/>
<text x="450.0" y="38" font-size="24" font-weight="bold">ZGC：用 CAS 避免覆盖并发更新</text>
<line class="life" x1="150" y1="142" x2="150" y2="640"/>
<line class="life" x1="450" y1="142" x2="450" y2="640"/>
<line class="life" x1="750" y1="142" x2="750" y2="640"/>
<path class="edge" d="M452 220 H748"/>
<path class="edge" d="M452 286 H540 V326 H452"/>
<path class="edge" d="M152 396 H748"/>
<path class="edge" d="M452 506 H748"/>
<path class="edge" d="M748 604 H452" stroke-dasharray="8 6"/>
<g class="node"><rect x="30" y="70" width="240" height="70" rx="8" fill="#eff6ff" stroke="#64748b" stroke-width="1.6"/>
<text x="150.0" y="112.0" font-size="20">应用线程</text>
</g>
<g class="node"><rect x="330" y="70" width="240" height="70" rx="8" fill="#eff6ff" stroke="#64748b" stroke-width="1.6"/>
<text x="450.0" y="112.0" font-size="20">屏障处理</text>
</g>
<g class="node"><rect x="630" y="70" width="240" height="70" rx="8" fill="#eff6ff" stroke="#64748b" stroke-width="1.6"/>
<text x="750.0" y="112.0" font-size="20">字段槽 p</text>
</g>
<g class="edge-label"><rect x="490.0" y="171.0" width="220" height="38" rx="5" fill="#fff"/>
<text x="600" y="197" font-size="20">读取旧编码 r</text>
</g>
<g class="edge-label"><rect x="547.0" y="270.0" width="190" height="66" rx="5" fill="#fff"/>
<text x="642" y="296" font-size="20">找到有效表示</text>
<text x="642" y="324" font-size="20">r′</text>
</g>
<g class="edge-label"><rect x="285.0" y="346.0" width="330" height="38" rx="5" fill="#fff"/>
<text x="450" y="372" font-size="20">更新为业务新引用 Q</text>
</g>
<g class="edge-label"><rect x="465.0" y="430.0" width="270" height="66" rx="5" fill="#fff"/>
<text x="600" y="456" font-size="20">CAS 仅在仍等于 r 时</text>
<text x="600" y="484" font-size="20">写入 r′</text>
</g>
<g class="edge-label"><rect x="475.0" y="556.0" width="250" height="38" rx="5" fill="#fff"/>
<text x="600" y="582" font-size="20">比较失败，保留 Q</text>
</g>
<text x="450.0" y="675" font-size="20">CAS 比较失败时，不覆盖应用线程已写入的 Q</text>
</svg>
