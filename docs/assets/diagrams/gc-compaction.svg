<rect x="248" y="62" width="64" height="62" rx="0" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
<text x="280.0" y="99" text-anchor="middle" font-size="18" font-weight="normal">B · 1</text>
<rect x="312" y="62" width="128" height="62" rx="0" fill="#ede9fe" stroke="#64748b" stroke-width="1.5"/>
<text x="376.0" y="99" text-anchor="middle" font-size="18" font-weight="normal">C · 2</text>
