<svg xmlns="http://www.w3.org/2000/svg" width="680" height="286" viewBox="0 0 680 286" role="img" aria-labelledby="title desc">
<title id="title">当前线程的逻辑调用栈</title><desc id="desc">从栈顶到栈底依次是 price、order 和 main。price 是当前帧，保存参数、局部变量和临时值；order 等待 price 返回。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#1e293b} .edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="680" height="286" rx="10" fill="#fff"/>
<text x="340" y="32" text-anchor="middle" font-size="21" font-weight="bold">当前线程的逻辑调用栈</text>
<rect x="28" y="60" width="500" height="66" rx="0" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/>
<text x="48" y="87" text-anchor="start" font-size="19" font-weight="bold">price 帧</text>
<text x="48" y="111" text-anchor="start" font-size="17" font-weight="normal">参数、局部变量、临时值</text>
<rect x="28" y="126" width="500" height="66" rx="0" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="48" y="153" text-anchor="start" font-size="19" font-weight="bold">order 帧</text>
<text x="48" y="177" text-anchor="start" font-size="17" font-weight="normal">等待 price 的结果</text>
<rect x="28" y="192" width="500" height="66" rx="0" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="48" y="219" text-anchor="start" font-size="19" font-weight="bold">main 帧</text>
<text x="48" y="243" text-anchor="start" font-size="17" font-weight="normal">调用入口</text>
<path class="edge" d="M 564 93 H 533"/>
<text x="614" y="99" text-anchor="middle" font-size="19" font-weight="normal">当前帧</text>
<text x="552" y="242" text-anchor="start" font-size="16" font-weight="normal">栈底</text>
</svg>
