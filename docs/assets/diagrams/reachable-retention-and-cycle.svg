<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">保留泄漏与孤立环</title><desc id="desc">左侧根通过服务与缓存集合保留业务已不用的值；右侧 A、B 相互引用，但没有根路径。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#1e293b;text-anchor:middle}.edge{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}.life{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:7 6}</style>
<rect width="900" height="620" rx="12" fill="#fff"/>
<text x="450.0" y="38" font-size="24" font-weight="bold">保留泄漏与孤立环</text>
<rect x="24" y="66" width="420" height="520" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="234.0" y="99" font-size="20" font-weight="bold">仍有强根路径</text>
<rect x="456" y="66" width="420" height="520" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="666.0" y="99" font-size="20" font-weight="bold">没有根路径</text>
<path class="edge" d="M234 188 V222"/>
<path class="edge" d="M234 302 V336"/>
<path class="edge" d="M234 416 V450"/>
<path class="edge" d="M660 288 V418"/>
<path class="edge" d="M508 460 H480 V246 H508"/>
<g class="node"><rect x="65" y="110" width="338" height="78" rx="8" fill="#eff6ff" stroke="#64748b" stroke-width="1.6"/>
<text x="234.0" y="156.0" font-size="20">运行时根</text>
</g>
<g class="node"><rect x="65" y="224" width="338" height="78" rx="8" fill="#eff6ff" stroke="#64748b" stroke-width="1.6"/>
<text x="234.0" y="270.0" font-size="20">仍存活的服务</text>
</g>
<g class="node"><rect x="65" y="338" width="338" height="78" rx="8" fill="#eff6ff" stroke="#64748b" stroke-width="1.6"/>
<text x="234.0" y="384.0" font-size="20">缓存集合</text>
</g>
<g class="node"><rect x="65" y="452" width="338" height="78" rx="8" fill="#eff6ff" stroke="#64748b" stroke-width="1.6"/>
<text x="234.0" y="498.0" font-size="20">业务已不用的值</text>
</g>
<g class="node"><rect x="510" y="206" width="300" height="80" rx="8" fill="#eff6ff" stroke="#64748b" stroke-width="1.6"/>
<text x="660.0" y="253.0" font-size="20">孤立 A</text>
</g>
<g class="node"><rect x="510" y="420" width="300" height="80" rx="8" fill="#eff6ff" stroke="#64748b" stroke-width="1.6"/>
<text x="660.0" y="467.0" font-size="20">孤立 B</text>
</g>
<g class="edge-label"><rect x="642.0" y="335.0" width="140" height="38" rx="5" fill="#fff"/>
<text x="712" y="361" font-size="20">相互引用</text>
</g>
</svg>
