<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320" role="img" aria-labelledby="title desc">
<title id="title">volatile 发布的 happens-before 链</title><desc id="desc">写线程先写 payload，再写 volatile ready；读线程先读 volatile ready，再读 payload。两个 ready 操作之间建立对应的同步关系。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#1e293b} .edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="780" height="320" rx="10" fill="#fff"/>
<text x="390" y="30" text-anchor="middle" font-size="21" font-weight="bold">volatile 发布的 happens-before 链</text>
<rect x="100" y="62" width="240" height="58" rx="6" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="220.0" y="97.0" text-anchor="middle" font-size="18" font-weight="normal">写 payload</text>
<rect x="460" y="62" width="240" height="58" rx="6" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="580.0" y="97.0" text-anchor="middle" font-size="18" font-weight="normal">写 volatile ready</text>
<rect x="100" y="226" width="240" height="58" rx="6" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="220.0" y="261.0" text-anchor="middle" font-size="18" font-weight="normal">读 payload</text>
<rect x="460" y="226" width="240" height="58" rx="6" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="580.0" y="261.0" text-anchor="middle" font-size="18" font-weight="normal">读 volatile ready</text>
<text x="22" y="98" text-anchor="start" font-size="17" font-weight="normal">写线程</text>
<text x="22" y="262" text-anchor="start" font-size="17" font-weight="normal">读线程</text>
<path class="edge" d="M 342 91 H 458"/>
<text x="400" y="76" text-anchor="middle" font-size="16" font-weight="normal">程序顺序</text>
<path class="edge" d="M 458 255 H 342"/>
<text x="400" y="240" text-anchor="middle" font-size="16" font-weight="normal">程序顺序</text>
<path class="edge" d="M 580 122 V 224"/>
<text x="604" y="178" text-anchor="start" font-size="17" font-weight="normal">同步关系</text>
</svg>
