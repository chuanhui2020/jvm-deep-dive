<svg xmlns="http://www.w3.org/2000/svg" width="780" height="398" viewBox="0 0 780 398" role="img" aria-labelledby="title desc">
<title id="title">根可达的保留链与不可达的孤立环</title>
<desc id="desc">左侧 GC root 指向静态缓存可达的集合，集合继续保留业务已不用的对象。右侧孤立对象 A 和 B 相互引用，但没有来自根的强路径，可以回收。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
  </marker>
</defs>
<style>
  text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#1e293b;text-anchor:middle}
  .node rect{fill:#eff6ff;stroke:#64748b;stroke-width:1.5}
  .edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}
</style>
<rect width="780" height="398" rx="10" fill="#fff"/>
<text x="390" y="30" font-size="21" font-weight="bold">根可达的保留链与不可达的孤立环</text>
<rect x="20" y="58" width="355" height="320" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="405" y="58" width="355" height="320" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="199" y="84" font-size="18" font-weight="bold">仍被根保留</text>
<text x="582" y="84" font-size="18" font-weight="bold">没有根路径的孤立环</text>
<g class="node">
  <rect x="62" y="96" width="274" height="48" rx="6"/>
  <text x="199" y="126" font-size="19">GC root</text>
</g>
<g class="node">
  <rect x="62" y="178" width="274" height="62" rx="6"/>
  <text x="199" y="203" font-size="18">静态缓存</text>
  <text x="199" y="225" font-size="18">可达的集合</text>
</g>
<g class="node">
  <rect x="62" y="274" width="274" height="62" rx="6"/>
  <text x="199" y="299" font-size="18">业务已不用</text>
  <text x="199" y="321" font-size="18">但仍被保留的对象</text>
</g>
<path class="edge" d="M199 146 V176"/>
<path class="edge" d="M199 242 V272"/>
<g class="node">
  <rect x="452" y="122" width="260" height="56" rx="6"/>
  <text x="582" y="156" font-size="18">孤立对象 A</text>
</g>
<g class="node">
  <rect x="452" y="258" width="260" height="56" rx="6"/>
  <text x="582" y="292" font-size="18">孤立对象 B</text>
</g>
<path class="edge" d="M582 180 V256"/>
<path class="edge" d="M450 286 H426 V150 H450"/>
<text x="644" y="223" font-size="16">相互引用</text>
<text x="199" y="365" font-size="17">仍可达，GC 会保留</text>
<text x="582" y="365" font-size="17">没有根路径，可回收</text>
</svg>
