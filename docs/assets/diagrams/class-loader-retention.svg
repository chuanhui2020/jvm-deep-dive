</g>
<g class="node"><rect x="70" y="360" width="320" height="78" rx="8" fill="#eff6ff" stroke="#64748b" stroke-width="1.6"/>
<text x="230.0" y="406.0" font-size="20">Loader 1</text>
</g>
<g class="node"><rect x="510" y="360" width="320" height="78" rx="8" fill="#eff6ff" stroke="#64748b" stroke-width="1.6"/>
